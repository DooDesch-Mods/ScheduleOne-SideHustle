<link rel="stylesheet" href="chat.css">

<div class="panel">
  <div class="head">
    <div class="who" id="who">Host</div>
    <div class="hint">They read this on their phone.</div>
  </div>

  <div class="log" id="log"></div>

  <div class="control">

    <div class="btn icon-only" id="send"><img src="icons/send.png" class="glyph"></div>
  </div>
</div>

<script src="chat.js"></script>
